<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#F2994A" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="url(#bgGradient)" rx="12"/>

  <!-- Geometric Emblem -->
  <g transform="translate(140, 175)">
    <!-- Shield/House Base -->
    <path d="M-50,-20 L0,-70 L50,-20 L50,50 C50,60 40,70 0,90 C-40,70 -50,60 -50,50 Z" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Structural Nail / Pillar -->
    <path d="M0,-95 L0,50" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M-20,-95 L20,-95" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M-8,50 L0,70 L8,50 Z" fill="#FFFFFF"/>
    <!-- Accents -->
    <line x1="-30" y1="20" x2="-15" y2="20" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="30" y2="20" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="260" y="155" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="3">NAILED IT</text>
  <text x="265" y="205" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="url(#goldGradient)" letter-spacing="6">PROPERTY SOLUTIONS</text>
  
  <!-- Subtle Subtitle for Business Model Focus -->
  <text x="265" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" letter-spacing="2">PREMIUM MAINTENANCE &amp; CONTRACTING</text>
</svg>
